---
name: dinov2-av-separator
description: DINOv2-guided audio-visual source separation with cross-modal attention

defaults:
  - _self_
  - model: default
  - data: default
  - train: phase1

hydra:
  run:
    dir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: logs/multirun/${now:%Y-%m-%d}
    subdir: ${hydra:job.num}

trainer:
  accelerator: "auto"
  devices: 1
  num_nodes: 1
  precision: null
  strategy: null

outputs:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

logger:
  save_dir: null
