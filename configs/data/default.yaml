# @package _global_
data:
  # --- Audio ---
  sample_rate: 16000
  clip_duration: 6  # seconds
  n_fft: 512
  hop_length: 160  # 10 ms at 16 kHz
  win_length: 400  # 25 ms at 16 kHz
  n_mels: 80
  f_min: 80
  f_max: 7600

  # --- Video ---
  video_fps: 25
  frame_size: 448
  patch_size: 14

  # --- Dataset ---
  # Note: phase configs (train/phase*.yaml) override batch_size and val_batch_size
  train_batch_size: 8
  val_batch_size: 4
  root: null
  cache_dir: "./cache"
  index_file: null
  num_workers: 4
  seed: 42
  # If true, mix clips from the same category (intra-category mixing).
  # If false (default), force mixing from different categories (cross-category).
  allow_same_category: false
