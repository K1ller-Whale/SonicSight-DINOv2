# @package _global_
train:
  name: "phase2_attention_warmup_kaggle"
  phase: "phase2"
  max_steps: 30_000
  max_epochs: null
  batch_size: 2
  val_batch_size: 2
  num_sources: 2
  grad_clip: 1.0
  gradient_accumulation_steps: 8   # Effective batch = 16 on memory-limited GPUs
  precision: "16-mixed"
  log_every_n_steps: 50
  val_check_interval: 2500
  check_val_every_n_epoch: null
  num_sanity_val_steps: 2
  early_stopping_patience: 10000
  checkpoint_every_n_steps: 2500
  resume_from_checkpoint: null      # Set to the Phase 1 checkpoint path
  load_weights_only: null           # Auto: true when checkpoint phase != phase2
  dinov2_batch_size: 4              # Frames per DINOv2 mini-batch when using mp4 visuals

  optimizer:
    name: "AdamW"
    lr_fusion: 5e-4
    weight_decay: 1e-4
    betas: [0.9, 0.999]

  scheduler:
    name: "cosine"
    warmup_steps: 1000

  loss:
    si_snr_weight: 1.0
    crm_weight: 0.0
    stft_weight: 0.0
    perceptual_weight: 0.0
    attention_entropy_weight: 0.1

  # Phase 2: visual attention warmup, fixed 2-source MUSIC mixtures
  disable_visual: false
  n_sources: 2

model:
  n_sources: 2

data:
  index_file: "./cache/index.json"
  cache_dir: "./cache"
  num_workers: 2
  seed: 42
  allow_same_category: false

trainer:
  accelerator: "auto"
  devices: "auto"

outputs:
  checkpoint_dir: "./checkpoints/phase2"
  log_dir: "./logs"
