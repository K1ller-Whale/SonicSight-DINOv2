# Kaggle training configuration
# Optimized for T4 GPU (16GB VRAM)
# Full 3-phase curriculum with progressive N=2->3->4

defaults:
  - data: default
  - model: default

model:
  n_sources: 4  # Will be overridden by progressive scheduler
  audio_channels: [2, 32, 64, 128, 256, 512]
  attention:
    n_heads: 8
    n_layers: 2
    d_model: 512
    ffn_dim: 2048
    dropout: 0.1
  visual:
    backbone: facebook/dinov2-base
    patch_dim: 768
    proj_dim: 512

train:
  # Phase 1: Audio-only (200K steps, N=2 fixed)
  phase1:
    max_steps: 200_000
    n_sources: 2
    batch_size: 8
    val_batch_size: 4
    grad_clip: 1.0
    optimizer:
      lr: 1e-3
      weight_decay: 1e-4
      betas: [0.9, 0.999]
    scheduler:
      name: cosine
      warmup_steps: 0
    loss:
      alpha_crm: 0.0
      beta_stft: 0.0
      gamma_perceptual: 0.0
    disable_visual: true

  # Phase 2: Cross-modal attention warmup (30K steps, N=2 fixed)
  phase2:
    max_steps: 30_000
    n_sources: 2
    batch_size: 8
    val_batch_size: 4
    grad_clip: 1.0
    optimizer:
      lr_fusion: 5e-4
    scheduler:
      name: cosine
      warmup_steps: 1000
    loss:
      alpha_crm: 0.0
      beta_stft: 0.0
      gamma_perceptual: 0.0
      attention_entropy_weight: 0.1
    disable_visual: false

  # Phase 3: End-to-end fine-tuning (100K steps, progressive N=2->3->4)
  phase3:
    max_steps: 100_000
    batch_size: 8
    val_batch_size: 4
    grad_clip: 1.0
    gradient_accumulation_steps: 4
    optimizer:
      lr_fusion: 3e-4
      lr_audio_enc: 3e-5
      lr_dinov2: 1e-5
      weight_decay: 1e-4
      betas: [0.9, 0.999]
    scheduler:
      name: cosine
      warmup_steps: 1000
    loss:
      alpha_crm: 0.1
      beta_stft: 0.05
      gamma_perceptual: 0.1
    # DINOv2 freezing config (A=fully frozen, B=last 2 unfrozen, C=last 4 unfrozen)
    dinov2:
      freeze_all: true
      unfrozen_blocks: 0
    # Progressive curriculum
    n_sources_schedule:
      - step: 0
        n: 2
      - step: 20000
        n: 3
      - step: 40000
        n: 4
    disable_visual: false

data:
  root: /kaggle/input/sonicsight-data
  cache_dir: /kaggle/working/cache
  index_file: /kaggle/working/cache/index.json
  num_workers: 2

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  log_every_n_steps: 100
  val_check_interval: 5000
  num_sanity_val_steps: 2

outputs:
  output_dir: /kaggle/working/outputs
  checkpoint_dir: /kaggle/working/checkpoints
  log_dir: /kaggle/working/logs